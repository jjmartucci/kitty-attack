<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kitty Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .touch-controls {
            display: none;
            flex-direction: column;
            justify-content: center;
            user-select: none;
            gap: 10px;
        }
        .control-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            border: none;
            border-radius: 12px;
            background: #3498db;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .control-btn:active {
            background: #2980b9;
        }
        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="touch-controls" id="left-controls">
            <button class="control-btn" id="btn-up">▲</button>
            <button class="control-btn" id="btn-down">▼</button>
        </div>
        <div id="game"></div>
        <div class="touch-controls" id="right-controls">
            <button class="control-btn" id="btn-left">◀</button>
            <button class="control-btn" id="btn-right">▶</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
